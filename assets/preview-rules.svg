<svg width="900" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480">
  <defs>
    <linearGradient id="rulesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1a0c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#080e08;stop-opacity:1"/>
    </linearGradient>
    <filter id="glowR">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="480" fill="url(#rulesBg)"/>

  <!-- Header -->
  <text x="30" y="46" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#4ade80" filter="url(#glowR)">CIRCUIT</text>
  <text x="138" y="46" font-family="'Courier New', monospace" font-size="13" fill="#ffffff40">/ circuit breaker rules</text>
  <line x1="30" y1="60" x2="870" y2="60" stroke="#1a3a1a" stroke-width="1"/>

  <!-- === RULE CARDS === -->

  <!-- Rule 1: HF Critical - ENABLED -->
  <rect x="30" y="80" width="400" height="100" rx="8" fill="#0d1a0d" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="30" y="80" width="400" height="28" rx="8" fill="#0f2e0f"/>
  <rect x="30" y="96" width="400" height="12" fill="#0f2e0f"/>
  <text x="50" y="100" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#4ade80">Health Factor Critical</text>
  <rect x="376" y="84" width="44" height="16" rx="8" fill="#4ade8030"/>
  <text x="398" y="96" font-family="'Courier New', monospace" font-size="9" fill="#4ade80" text-anchor="middle">ON</text>
  <text x="50" y="128" font-family="'Courier New', monospace" font-size="10" fill="#ffffff60">CONDITION   health_factor below 1.05</text>
  <text x="50" y="146" font-family="'Courier New', monospace" font-size="10" fill="#ffffff60">ACTION      alert_only</text>
  <text x="50" y="164" font-family="'Courier New', monospace" font-size="10" fill="#fbbf24">THRESHOLD   1.05  HF</text>

  <!-- Rule 2: HF Warning - ENABLED -->
  <rect x="470" y="80" width="400" height="100" rx="8" fill="#0d1a0d" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="470" y="80" width="400" height="28" rx="8" fill="#0f2e0f"/>
  <rect x="470" y="96" width="400" height="12" fill="#0f2e0f"/>
  <text x="490" y="100" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#4ade80">Health Factor Warning</text>
  <rect x="816" y="84" width="44" height="16" rx="8" fill="#4ade8030"/>
  <text x="838" y="96" font-family="'Courier New', monospace" font-size="9" fill="#4ade80" text-anchor="middle">ON</text>
  <text x="490" y="128" font-family="'Courier New', monospace" font-size="10" fill="#ffffff60">CONDITION   health_factor below 1.15</text>
  <text x="490" y="146" font-family="'Courier New', monospace" font-size="10" fill="#ffffff60">ACTION      reduce_position</text>
  <text x="490" y="164" font-family="'Courier New', monospace" font-size="10" fill="#fbbf24">THRESHOLD   1.15  HF</text>

  <!-- Rule 3: Large Drawdown - DISABLED -->
  <rect x="30" y="200" width="400" height="100" rx="8" fill="#0a0f0a" stroke="#374151" stroke-width="1"/>
  <rect x="30" y="200" width="400" height="28" rx="8" fill="#0e160e"/>
  <rect x="30" y="216" width="400" height="12" fill="#0e160e"/>
  <text x="50" y="220" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#6b7280">Large Drawdown</text>
  <rect x="376" y="204" width="44" height="16" rx="8" fill="#37415130"/>
  <text x="398" y="216" font-family="'Courier New', monospace" font-size="9" fill="#6b7280" text-anchor="middle">OFF</text>
  <text x="50" y="248" font-family="'Courier New', monospace" font-size="10" fill="#ffffff30">CONDITION   pnl below -20%</text>
  <text x="50" y="266" font-family="'Courier New', monospace" font-size="10" fill="#ffffff30">ACTION      close_position</text>
  <text x="50" y="284" font-family="'Courier New', monospace" font-size="10" fill="#ffffff30">THRESHOLD   20%  drawdown</text>

  <!-- Rule 4: Auto Add Collateral - DISABLED -->
  <rect x="470" y="200" width="400" height="100" rx="8" fill="#0a0f0a" stroke="#374151" stroke-width="1"/>
  <rect x="470" y="200" width="400" height="28" rx="8" fill="#0e160e"/>
  <rect x="470" y="216" width="400" height="12" fill="#0e160e"/>
  <text x="490" y="220" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#6b7280">Auto Add Collateral</text>
  <rect x="816" y="204" width="44" height="16" rx="8" fill="#37415130"/>
  <text x="838" y="216" font-family="'Courier New', monospace" font-size="9" fill="#6b7280" text-anchor="middle">OFF</text>
  <text x="490" y="248" font-family="'Courier New', monospace" font-size="10" fill="#ffffff30">CONDITION   health_factor below 1.20</text>
  <text x="490" y="266" font-family="'Courier New', monospace" font-size="10" fill="#ffffff30">ACTION      add_collateral</text>
  <text x="490" y="284" font-family="'Courier New', monospace" font-size="10" fill="#ffffff30">THRESHOLD   1.20  HF</text>

  <!-- Action flow diagram -->
  <text x="30" y="338" font-family="'Courier New', monospace" font-size="11" fill="#ffffff30" letter-spacing="2">ACTION FLOW</text>
  <line x1="30" y1="346" x2="870" y2="346" stroke="#1a3a1a" stroke-width="1"/>

  <!-- Flow steps -->
  <rect x="30" y="360" width="130" height="44" rx="6" fill="#0d1a0d" stroke="#4ade8060" stroke-width="1"/>
  <text x="95" y="380" font-family="'Courier New', monospace" font-size="11" fill="#4ade80" text-anchor="middle">DETECT</text>
  <text x="95" y="396" font-family="'Courier New', monospace" font-size="9" fill="#ffffff40" text-anchor="middle">HF drop</text>

  <text x="176" y="386" font-family="'Courier New', monospace" font-size="14" fill="#4ade8060">→</text>

  <rect x="196" y="360" width="130" height="44" rx="6" fill="#0d1a0d" stroke="#4ade8060" stroke-width="1"/>
  <text x="261" y="380" font-family="'Courier New', monospace" font-size="11" fill="#4ade80" text-anchor="middle">ASSESS</text>
  <text x="261" y="396" font-family="'Courier New', monospace" font-size="9" fill="#ffffff40" text-anchor="middle">rule match</text>

  <text x="342" y="386" font-family="'Courier New', monospace" font-size="14" fill="#4ade8060">→</text>

  <rect x="362" y="360" width="130" height="44" rx="6" fill="#0d1a0d" stroke="#fbbf2460" stroke-width="1"/>
  <text x="427" y="380" font-family="'Courier New', monospace" font-size="11" fill="#fbbf24" text-anchor="middle">CLAUDE</text>
  <text x="427" y="396" font-family="'Courier New', monospace" font-size="9" fill="#ffffff40" text-anchor="middle">analysis</text>

  <text x="508" y="386" font-family="'Courier New', monospace" font-size="14" fill="#4ade8060">→</text>

  <rect x="528" y="360" width="130" height="44" rx="6" fill="#0d1a0d" stroke="#4ade8060" stroke-width="1"/>
  <text x="593" y="380" font-family="'Courier New', monospace" font-size="11" fill="#4ade80" text-anchor="middle">NOTIFY</text>
  <text x="593" y="396" font-family="'Courier New', monospace" font-size="9" fill="#ffffff40" text-anchor="middle">user alert</text>

  <text x="674" y="386" font-family="'Courier New', monospace" font-size="14" fill="#4ade8060">→</text>

  <rect x="694" y="360" width="176" height="44" rx="6" fill="#071207" stroke="#ef444460" stroke-width="1.5"/>
  <text x="782" y="380" font-family="'Courier New', monospace" font-size="11" fill="#ef4444" text-anchor="middle">EXECUTE</text>
  <text x="782" y="396" font-family="'Courier New', monospace" font-size="9" fill="#ef444480" text-anchor="middle">if AUTO_EXIT=true</text>

  <text x="450" y="448" font-family="'Courier New', monospace" font-size="9" fill="#ffffff15" text-anchor="middle">CIRCUIT  •  AUTOMATED DEFI RISK MANAGEMENT  •  CLAUDE AGENT SDK</text>
</svg>
